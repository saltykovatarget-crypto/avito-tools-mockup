<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Авитолог PRO — Пополнить кошелёк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* === тёмные токены реального сайта (.dark + TopupModal) === */
  :root{
    --text:#FFFFFF; --muted:#9CA3AF;
    --card:#16181F; --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.12);
    --input-bg:rgba(255,255,255,.04); --pill-bg:rgba(255,255,255,.05);
    --brand:#6F42C1; --brand-2:#9A7FE0;
    --brand-tint:rgba(111,66,193,.12); --brand-line:rgba(111,66,193,.55);
    --success:#34d399; --success-bg:rgba(52,211,153,.12); --success-line:rgba(52,211,153,.25);
    --radius-lg:14px; --radius-xl:20px; --radius-pill:999px;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#0A0D14 0%,#0C1020 100%);color:var(--text);min-height:100vh;
    display:grid;place-items:start center;padding:48px 18px;}
  .card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-xl);box-shadow:0 24px 60px -20px rgba(0,0,0,.6);overflow:hidden;}

  .head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 14px;border-bottom:1px solid var(--border);}
  .head .title{font-size:18px;font-weight:700;letter-spacing:-.01em;}
  .head .bal{font-size:12px;color:var(--muted);margin-top:3px;}
  .head .bal b{color:var(--text);font-weight:600;}
  .x{width:32px;height:32px;border:none;background:var(--pill-bg);border-radius:var(--radius-pill);
    color:var(--muted);font-size:14px;cursor:pointer;display:grid;place-items:center;}
  .x:hover{background:rgba(255,255,255,.10);}

  .tabs{padding:16px 24px 0;}
  .tabwrap{display:inline-flex;padding:4px;border-radius:var(--radius-pill);background:var(--pill-bg);border:1px solid var(--border);}
  .tab{border:none;background:transparent;cursor:pointer;font-family:inherit;
    padding:7px 16px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s;}
  .tab.on{background:linear-gradient(90deg,#6F42C1,#9A7FE0);color:#fff;box-shadow:0 6px 16px -8px rgba(111,66,193,.6);}

  .body{padding:18px 24px;}
  .pkgs{display:flex;flex-direction:column;gap:12px;}
  .pkg{position:relative;text-align:left;cursor:pointer;background:rgba(255,255,255,.02);
    border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;transition:.15s;font-family:inherit;color:var(--text);}
  .pkg:hover{border-color:rgba(154,127,224,.30);}
  .pkg.on{border-color:var(--brand-line);background:var(--brand-tint);box-shadow:0 8px 22px -10px rgba(111,66,193,.4);}
  .pkg .req{font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .pkg .per{font-size:12px;color:var(--muted);margin-top:3px;}
  .pkg .save{display:inline-block;margin-top:9px;padding:3px 9px;border-radius:var(--radius-pill);
    font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    background:var(--success-bg);color:var(--success);border:1px solid var(--success-line);}
  .pkg .price{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums;color:#C5B0F0;}
  .pkg .pop{position:absolute;top:-10px;right:14px;padding:3px 9px;border-radius:var(--radius-pill);
    font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;
    background:linear-gradient(90deg,#6F42C1,#9A7FE0);box-shadow:0 4px 14px rgba(111,66,193,.45);}
  .pkg .right{text-align:right;flex-shrink:0;}
  .pkg .tick{display:none;margin-top:8px;margin-left:auto;width:20px;height:20px;border-radius:var(--radius-pill);
    background:linear-gradient(135deg,#6F42C1,#9A7FE0);color:#fff;align-items:center;justify-content:center;font-size:11px;}
  .pkg.on .tick{display:inline-flex;}

  .reg{display:none;flex-direction:column;gap:14px;}
  .reg.show{display:flex} .pkgs.hide{display:none}
  .reg .hint{font-size:12.5px;color:var(--muted);}
  .amtwrap{position:relative;}
  .amtwrap input{width:100%;font-family:inherit;font-size:24px;font-weight:800;padding:15px 52px 15px 18px;
    background:var(--input-bg);border:1.5px solid var(--border-strong);border-radius:var(--radius-lg);color:var(--text);outline:none;font-variant-numeric:tabular-nums;}
  .amtwrap input:focus{border-color:var(--brand-line);}
  .amtwrap .cur{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;color:var(--muted);}
  .quick{display:flex;gap:8px;}
  .quick button{flex:1;font-family:inherit;cursor:pointer;padding:9px;border-radius:var(--radius-pill);
    font-size:12.5px;font-weight:700;background:var(--brand-tint);color:#C5B0F0;border:1px solid rgba(154,127,224,.25);transition:.15s;}
  .quick button:hover{background:rgba(154,127,224,.20);}

  .foot{padding:16px 24px 22px;border-top:1px solid var(--border);}
  .pay{width:100%;height:50px;border:none;cursor:pointer;font-family:inherit;border-radius:var(--radius-pill);
    background:linear-gradient(90deg,#6F42C1,#9A7FE0);color:#fff;font-size:15px;font-weight:700;
    box-shadow:0 12px 30px -12px rgba(111,66,193,.6);transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .pay:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .legal{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <div class="title">Пополнить кошелёк</div>
        <div class="bal">Баланс: <b>50 ₽</b> <span style="color:var(--muted)">— это ≈ 10 запросов</span></div>
      </div>
      <button class="x" aria-label="Закрыть">✕</button>
    </div>

    <div class="tabs">
      <div class="tabwrap">
        <button class="tab on" id="t-pkg">Пакеты запросов</button>
        <button class="tab" id="t-reg">Рублями</button>
      </div>
    </div>

    <div class="body">
      <div class="pkgs" id="pkgs">
        <button class="pkg" data-pay="390">
          <div><div class="req">100 запросов</div>
            <div class="per">3,9 ₽ за запрос</div>
            <div class="save">Выгода 22%</div></div>
          <div class="right"><div class="price">390 ₽</div><div class="tick">✓</div></div>
        </button>
        <button class="pkg on" data-pay="990">
          <div class="pop">Популярный</div>
          <div><div class="req">300 запросов</div>
            <div class="per">3,3 ₽ за запрос</div>
            <div class="save">Выгода 34%</div></div>
          <div class="right"><div class="price">990 ₽</div><div class="tick">✓</div></div>
        </button>
        <button class="pkg" data-pay="1490">
          <div><div class="req">500 запросов</div>
            <div class="per">2,98 ₽ за запрос</div>
            <div class="save">Выгода 40%</div></div>
          <div class="right"><div class="price">1 490 ₽</div><div class="tick">✓</div></div>
        </button>
      </div>

      <div class="reg" id="reg">
        <div class="hint">Пополнить баланс рублями (от 100 ₽). Зачисляется ровно столько, сколько положишь. Запросы списываются по обычной цене.</div>
        <div class="amtwrap"><input id="amt" type="text" inputmode="numeric" value="200" /><span class="cur">₽</span></div>
        <div class="quick">
          <button data-amt="100">100 ₽</button>
          <button data-amt="200">200 ₽</button>
          <button data-amt="500">500 ₽</button>
        </div>
      </div>
    </div>

    <div class="foot">
      <button class="pay" id="pay">Перейти к оплате</button>
      <div class="legal">Оплата через Точка Банк. Деньги не сгорают. Возврат — через поддержку.</div>
    </div>
  </div>

<script>
  const pkgs=document.getElementById('pkgs'), reg=document.getElementById('reg');
  const tPkg=document.getElementById('t-pkg'), tReg=document.getElementById('t-reg');
  const amt=document.getElementById('amt'), pay=document.getElementById('pay');
  let tab='package', selPay=990;
  const fmt=n=>n.toLocaleString('ru-RU');
  pkgs.querySelectorAll('.pkg').forEach(p=>p.addEventListener('click',()=>{
    pkgs.querySelectorAll('.pkg').forEach(x=>x.classList.remove('on'));
    p.classList.add('on'); selPay=+p.dataset.pay;
  }));
  tPkg.onclick=()=>{tab='package';tPkg.classList.add('on');tReg.classList.remove('on');pkgs.classList.remove('hide');reg.classList.remove('show');};
  tReg.onclick=()=>{tab='regular';tReg.classList.add('on');tPkg.classList.remove('on');pkgs.classList.add('hide');reg.classList.add('show');};
  reg.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>amt.value=b.dataset.amt);
  amt.addEventListener('input',()=>amt.value=amt.value.replace(/[^\d]/g,''));
  pay.onclick=()=>{let s=tab==='package'?selPay:(parseInt((amt.value||'').replace(/\s/g,''),10)||0);
    if(tab==='regular'&&s<100){alert('Минимум 100 ₽');return;}
    alert('→ Оплата через Точка Банк: '+fmt(s)+' ₽\\n(подключается эквайринг)');};
</script>
</body>
</html>
