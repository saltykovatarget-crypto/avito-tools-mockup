<!--
  JSON-LD разметка для aiavitologpro.ru
  Вставляется в <head> каждой страницы (Organization + WebSite) и на соответствующие
  страницы (SoftwareApplication на главную, FAQPage на главную или страницу FAQ).

  Все цифры сверены с r1/tz/00_WALLET_MODEL.md на 18.08.2026.
  При изменении прайса — править здесь И в 00_WALLET_MODEL.md одновременно.

  ⚠️ Перед выкладкой проверить: https://validator.schema.org/ и Яндекс.Вебмастер →
  «Валидатор микроразметки».
-->

<!-- ═══ 1. Организация — на все страницы ═══ -->
<script type="application/ld+json">

  "@context": "https://schema.org",
  "@type": "Organization",

  "name": "AI Авитолог PRO",
  "url": "https://aiavitologpro.ru/",
  "description": "ИИ-агент для продвижения на Авито: анализ ниши конкурентов с компьютерным зрением, разбор статистики кабинета и пошаговая стратегия по объявлениям.",
  "areaServed": {
    "@type": "Country",
    "name": "Россия"
  },
  "knowsAbout": [
    "продвижение на Авито",
    "анализ конкурентов на Авито",
    "платное продвижение VAS на Авито",
    "оптимизация объявлений",
    "аналитика маркетплейсов"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer support",
    "url": "https://t.me/valeriia_avitolog",
    "availableLanguage": "Russian"
  }
}
</script>

<!-- ═══ 2. Сайт — на все страницы ═══ -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://aiavitologpro.ru/#website",
  "url": "https://aiavitologpro.ru/",
  "name": "AI Авитолог PRO",
  "inLanguage": "ru-RU",
  "publisher": { "@id": "https://aiavitologpro.ru/#organization" }

<!-- ═══ 4. FAQ — на главную или отдельную страницу FAQ ═══
     Важно: разметка FAQPage должна дублировать текст, реально видимый на странице.
     Если этих вопросов на странице нет — сначала добавить их в вёрстку, потом разметку.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "ru-RU",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Сколько стоит AI Авитолог PRO?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Подписки нет — вы платите только за конкретные действия. Ответ ИИ-агента стоит 5 ₽, разбор ниши конкурентов — 190 ₽, анализ XLS-статистики из кабинета — 50 ₽. При регистрации начисляется 50 ₽ бонусом, минимальное пополнение — 100 ₽. Типовой проект обходится примерно в 580 ₽: пакет 100 запросов за 390 ₽ плюс один прогон парсера за 190 ₽."
      }
    },
    {
      "@type": "Question",
      "name": "Нужно ли оформлять подписку?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Нет. Сервис работает по модели кошелька: вы пополняете баланс в рублях и тратите его на нужные действия. Тарифов, месячных платежей, лимитов на количество запросов и сроков сгорания денег нет. Неиспользованный остаток можно вернуть через поддержку."
      }
    },
    {
      "@type": "Question",
      "name": "Что именно делает парсер ниши за 190 ₽?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Парсер собирает топ-100 объявлений выдачи Авито по вашему запросу и городу и считает по ним: пятёрку лидеров с долями рынка и просмотрами в день, ценовые сегменты, паттерны заголовков (частые слова, средняя длина, использование бренда), долю продавцов с платным продвижением, а также визуальные паттерны фото топа — тип съёмки, наличие текста и логотипа на изображении. На выходе — готовые выводы, а не просто таблица."
      }
    },
    {
      "@type": "Question",
      "name": "Чем это отличается от консультации живого авитолога?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Методология та же, но дешевле и без записи на приём. Час консультации авитолога стоит 3 000–5 000 ₽, работа агентства — от 50 000 ₽, обучающие курсы — 30 000–100 000 ₽. Разбор ниши и стратегия в AI Авитолог PRO обходятся примерно в 580 ₽. Агент работает круглосуточно и опирается на свежие данные выдачи, а не на память о нише."
      }
    },
    {
      "@type": "Question",
      "name": "Какой CTR считается нормальным для объявления на Авито?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ориентир зависит от типа проекта: для товарных категорий нормальный CTR — 4–7%, для услуг — 8–12%. Если CTR ниже нормы, проблема на этапе показы → просмотры, то есть в заголовке, первом фото или цене. Если CTR в норме, а заявок мало, потеря происходит дальше — в тексте объявления или в самом предложении. Именно по этой логике агент ищет точку потери в воронке."
      }
    },
    {
      "@type": "Question",
      "name": "Нужен ли VPN для работы с сервисом?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Нет, сервис работает в России напрямую. Регистрация проходит через Telegram, оплата — российскими картами."
      }
    }
  ]
}
</script>
